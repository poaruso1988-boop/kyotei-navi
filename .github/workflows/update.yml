name: update kyotei-navi
# 09:00-22:59 JST (= 00:00-13:59 UTC) に定期更新。
#   02,17,32,47分 (JST同じ) … refresh: 直前情報・オッズ・結果・コメント → 毎回公開
#   07,12,22,27,37,42,52,57分 … tenji: 締切50分以内の展示タイムのみ → 変化があった時だけ公開
# 本日分が未取得なら(毎朝最初の実行)自動で full。GitHub の schedule は数分〜十数分遅れたり、混雑時はスキップされることがある。
on:
  schedule:
    - cron: "2,17,32,47 0-13 * * *"
    - cron: "7,12,22,27,37,42,52,57 0-13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh / tenji / full"
        default: refresh
        type: choice
        options: [refresh, tenji, full]

concurrency:
  group: kyotei-navi-update   # box の flock の代わり: 同時に1本だけ
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write          # 古い状態キャッシュの削除
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: pip install -q -r ci/requirements.txt
      - name: restore encrypted state
        uses: actions/cache/restore@v6
        with:
          path: state.enc
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: unpack state
        run: ci/state.sh unpack
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: restore past days from live site if needed
        run: ls site/data/2*.json >/dev/null 2>&1 || python3 ci/restore_live.py || echo "restore_live failed (続行)"
        env:
          KYOTEI_PW: ${{ secrets.KYOTEI_PW }}
      - name: update
        id: run
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "2,17,32,47 0-13 * * *" ]; then MODE=refresh; else MODE=tenji; fi
          fi
          echo "mode=$MODE"
          ci/update.sh "$MODE"
        env:
          KYOTEI_PW: ${{ secrets.KYOTEI_PW }}
          KYOTEI_SALT_B64: ${{ secrets.KYOTEI_SALT_B64 }}
      - name: pack state
        if: ${{ !cancelled() }}
        run: ci/state.sh pack
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: save encrypted state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: state.enc
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: prune old state caches
        if: ${{ !cancelled() }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | xargs -r -n1 gh cache delete || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: upload site (encrypted data only)
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/repo
          retention-days: 1

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: check live
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deployment.outputs.page_url }}")
            at=$(curl -s "${{ steps.deployment.outputs.page_url }}data/key.json?t=$(date +%s)" | python3 -c "import sys,json;print(json.load(sys.stdin)['deployed_at'])" 2>/dev/null)
            echo "HTTP $code deployed_at=$at"; [ "$code" = 200 ] && break; sleep 15
          done
